name: "Build and Publish Release APK"

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version (ForgeBuild Contract)
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "=== Fetching existing releases and tags ==="
          RELEASES_RAW=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null || true)
          HIGHEST_RELEASE=$(echo "$RELEASES_RAW" | grep -oP '^v1\.0\.\K[0-9]+$' | sort -n | tail -1 || true)
          
          GIT_TAGS_RAW=$(git tag -l "v1.0.*" || true)
          HIGHEST_TAG=$(echo "$GIT_TAGS_RAW" | grep -oP '^v1\.0\.\K[0-9]+$' | sort -n | tail -1 || true)
          
          HIGHEST=0
          if [ -n "$HIGHEST_RELEASE" ] && [ "$HIGHEST_RELEASE" -gt "$HIGHEST" ]; then
            HIGHEST=$HIGHEST_RELEASE
          fi
          if [ -n "$HIGHEST_TAG" ] && [ "$HIGHEST_TAG" -gt "$HIGHEST" ]; then
            HIGHEST=$HIGHEST_TAG
          fi
          
          echo "Highest detected release number: $HIGHEST_RELEASE"
          echo "Highest detected git tag number: $HIGHEST_TAG"
          echo "Highest overall number: $HIGHEST"
          
          # Compute N = max(HIGHEST + 1, 60)
          CANDIDATE=$(( HIGHEST + 1 ))
          if [ "$CANDIDATE" -lt 60 ]; then
            N=60
          else
            N=$CANDIDATE
          fi
          
          TAG="v1.0.${N}"
          VNAME="1.0.${N}"
          # Must be strictly greater than any previously installed APK (previous highest was 189)
          VCODE=$(( 1000 + N ))
          
          echo "Computed: N=$N, TAG=$TAG, VNAME=$VNAME, VCODE=$VCODE"
          
          # --- WORKFLOW SELF-CHECK STEP ---
          echo "=== Running versioning self-check ==="
          if [ "$N" -le "$HIGHEST" ]; then
            echo "::error::Next version $N is not greater than highest existing version $HIGHEST!"
            exit 1
          fi
          
          if [ "$VCODE" -le 189 ]; then
            echo "::error::VersionCode $VCODE is not strictly greater than installed version code (189)!"
            exit 1
          fi
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists in git! Aborting to prevent overwriting."
            exit 1
          fi
          
          RELEASE_EXISTS=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.tag_name' 2>/dev/null || true)
          if [ -n "$RELEASE_EXISTS" ]; then
            echo "::error::Release $TAG already exists on GitHub! Aborting to prevent overwriting."
            exit 1
          fi
          
          echo "Self-check passed: $TAG is brand new, VCODE=$VCODE > 189, VNAME=$VNAME matches."
          
          echo "APP_VERSION_CODE=${VCODE}" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=${VNAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "vcode=${VCODE}" >> $GITHUB_OUTPUT
          echo "vname=${VNAME}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Signing Keystore
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is missing! All builds must be signed with the stable release key."
            exit 1
          fi
          echo "Loading stable release keystore from secrets..."
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
          echo "RELEASE_KEYSTORE_PATH=/tmp/release.jks" >> $GITHUB_ENV
          echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Release APKs
        run: |
          ./gradlew :app:assembleRelease -PappVersionCode=${{ steps.versioning.outputs.vcode }} -PappVersionName=${{ steps.versioning.outputs.vname }} --stacktrace

      - name: Stage APKs
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-apks/ \;
          ls -la release-apks/

      - name: Verify APK Signatures
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          for apk in release-apks/*.apk; do
            echo "=== Checking certificate for $apk ==="
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              $APKSIGNER verify --print-certs "$apk"
            else
              keytool -printcert -jarfile "$apk"
            fi
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: salty-graphics-release-apks
          path: release-apks/*.apk

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Salty Graphics Beta ${{ steps.versioning.outputs.tag }}
          body: |
            ### Salty Graphics Android Beta Release (${{ steps.versioning.outputs.tag }})
            Built automatically by GitHub Actions CI for Victor (MOTIONSALT).

            - **Version Code:** ${{ steps.versioning.outputs.vcode }}
            - **Version Name:** ${{ steps.versioning.outputs.vname }}
            - **Certificate SHA-256:** `96:65:26:AF:4F:0A:85:3C:95:AA:8E:16:37:3F:ED:70:9D:58:A8:8D:6B:27:54:6C:63:93:E9:E3:9A:FC:47:85`
            - **Certificate SHA-1:** `D9:62:D4:EE:EA:6F:B7:6F:FC:0B:08:80:A2:00:BA:AA:91:14:2B:61`

            ${{ github.event.inputs.release_notes }}

            **Included APKs:**
            - Universal APK (runs on all supported Android devices)
            - ABI-specific APKs (arm64-v8a, armeabi-v7a, x86_64)

            Install directly on your Android phone.
          files: release-apks/*.apk
          draft: false
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
