name: "Tests and Debug Build"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'ui-kit/**'
      - 'gradle/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'ui-kit/**'
      - 'gradle/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run Scaffold Acceptance Tests
        run: |
          ./gradlew :ui-kit:testDebugUnitTest --stacktrace
          ./gradlew :app:testDebugUnitTest --tests 'com.motionssalt.saltygraphics.ScaffoldToolPanelTest' --tests 'com.motionssalt.saltygraphics.ProjectSettingsScaffoldTest' --tests 'com.motionssalt.saltygraphics.ProjectSettingsVisibilityTest' --tests 'com.motionssalt.saltygraphics.ProjectSettingsGoldenTest' --tests 'com.motionssalt.saltygraphics.ProjectSettingsTest' --tests 'com.motionssalt.saltygraphics.ScaffoldMigrationBoundaryTest' --tests 'com.motionssalt.saltygraphics.ScaffoldControlGestureTest' --stacktrace

      - name: Run Engine and JVM Compose Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/test-results/
            engine/build/test-results/
            app/build/reports/tests/
            engine/build/reports/tests/
            ui-kit/build/test-results/
            ui-kit/build/reports/tests/

      - name: Upload Scaffold Screenshot Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-screenshots
          path: app/build/outputs/scaffold-screenshots/

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
