name: Build and Release Salty Graphics APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute Build Version
        id: versioning
        run: |
          BUILD_NUM=${{ github.run_number }}
          VCODE=$((100 + BUILD_NUM))
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VNAME="${TAG_NAME#v}"
          else
            TAG_NAME="v1.0.${BUILD_NUM}"
            VNAME="1.0.${BUILD_NUM}-beta"
          fi
          echo "APP_VERSION_CODE=${VCODE}" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=${VNAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "vcode=${VCODE}" >> $GITHUB_OUTPUT
          echo "vname=${VNAME}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Signing Keystore
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is missing! All builds must be signed with the stable release key."
            exit 1
          fi
          echo "Loading stable release keystore from secrets..."
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
          echo "RELEASE_KEYSTORE_PATH=/tmp/release.jks" >> $GITHUB_ENV
          echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Run Engine and JVM Compose Tests
        run: ./gradlew test --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/test-results/
            engine/build/test-results/
            app/build/reports/tests/
            engine/build/reports/tests/

      - name: Build Release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename and Stage APKs
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-apks/ \;
          ls -la release-apks/

      - name: Verify APK Signatures and Certificate Fingerprint
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          for apk in release-apks/*.apk; do
            echo "=== Checking certificate for $apk ==="
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              $APKSIGNER verify --print-certs "$apk"
            else
              keytool -printcert -jarfile "$apk"
            fi
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: salty-graphics-apks
          path: release-apks/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Salty Graphics Beta ${{ env.RELEASE_TAG }}
          body: |
            ### Salty Graphics Android Beta Release (${{ env.RELEASE_TAG }})
            Built automatically by GitHub Actions CI for Victor (MOTIONSALT).
            
            - **Version Code:** ${{ env.APP_VERSION_CODE }}
            - **Version Name:** ${{ env.APP_VERSION_NAME }}
            - **Certificate SHA-256:** `96:65:26:AF:4F:0A:85:3C:95:AA:8E:16:37:3F:ED:70:9D:58:A8:8D:6B:27:54:6C:63:93:E9:E3:9A:FC:47:85`
            - **Certificate SHA-1:** `D9:62:D4:EE:EA:6F:B7:6F:FC:0B:08:80:A2:00:BA:AA:91:14:2B:61`
            
            **Included APKs:**
            - Universal APK (runs on all supported devices)
            - arm64-v8a (optimized for modern 64-bit phones)
            - armeabi-v7a (for 32-bit devices)
            - x86_64 (for emulators / Chromebooks)
            
            Install directly on your Android phone.
          files: release-apks/*.apk
          draft: false
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

